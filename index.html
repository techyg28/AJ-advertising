<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJ Advertising Agency | Creativity, Innovation & User Experience</title>
    <meta name="description" content="A modern, high-contrast creative digital advertising agency serving individuals, startups, and SMBs with digital marketing, web development, and media production." />
    <meta property="og:title" content="AJ Advertising Agency | Creativity, Innovation & User Experience" />
    <meta property="og:description" content="High-impact digital marketing, custom web development, and media marketing solutions for individuals, startups, and SMBs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111111'/><text x='50%' y='62%' font-family='sans-serif' font-weight='900' font-size='50' fill='%23FF3B30' text-anchor='middle'>AJ</text></svg>" />
  </head>
  <body class="bg-[#111111] text-neutral-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] selection:bg-[#FF3B30] selection:text-white">
    <div id="root"></div>
    <script>
      // Fallback redirect if user deployed GitHub Pages directly from repository root
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs/')) {
        const repoPath = window.location.pathname.replace(/\/$/, '');
        const devScript = document.querySelector('script[src*="main.tsx"]');
        if (devScript) {
          window.location.replace((repoPath || '') + '/docs/');
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
